<svg width="67" height="39" viewBox="0 0 67 39" fill="none" xmlns="http://www.w3.org/2000/svg">
<style>
.avatar-mark {
  opacity: 0;
  transform-box: fill-box;
  transform-origin: center;
  animation: avatar-pop 620ms cubic-bezier(.2,1.35,.32,1) 180ms both;
}
.read-line {
  transform-box: fill-box;
  transform-origin: left center;
  animation: read-fill 900ms cubic-bezier(.22,1,.36,1) 620ms both;
}
.read-line.secondary {
  animation-delay: 760ms;
}
.pulse-line {
  transform-box: fill-box;
  transform-origin: left center;
  animation: line-breathe 2.8s ease-in-out 1.35s infinite alternate;
}
.pulse-line.short {
  animation-duration: 3.2s;
  animation-delay: 1.55s;
}
@keyframes avatar-pop {
  0% { opacity: 0; transform: scale(.42); }
  58% { opacity: 1; transform: scale(1.12); }
  100% { opacity: 1; transform: scale(1); }
}
@keyframes read-fill {
  0% { opacity: .2; transform: scaleX(0); }
  100% { opacity: 1; transform: scaleX(1); }
}
@keyframes line-breathe {
  0% { transform: scaleX(.72); opacity: .68; }
  52% { transform: scaleX(1); opacity: 1; }
  100% { transform: scaleX(.84); opacity: .78; }
}
@media (prefers-reduced-motion: reduce) {
  .avatar-mark,
  .read-line,
  .pulse-line {
    animation: none;
    opacity: 1;
    transform: none;
  }
}
</style>
